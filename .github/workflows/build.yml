name: Build OcarinaStudio

# Manual build: Actions tab -> "Build OcarinaStudio" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: What to build
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
          - android
          - android-arm64
          - android-arm32
      upstream_ref:
        description: Ship of Harkinian commit to build on (leave empty for the tested one)
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Ship of Harkinian commit this version of OcarinaStudio is developed and tested against.
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'd4bf6528a3bb242bc5d862e4f1ab2b6d385c157b' }}

# Layout of the workspace in every job:
#   .        Ship of Harkinian (the build tree, same as its own workflow)
#   studio/  this repository (patches, overlay, icons, scripts)

jobs:
  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Ship of Harkinian
      uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Ship of Harkinian
      uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
        submodules: true
    - name: Checkout OcarinaStudio
      uses: actions/checkout@v7
      with:
        path: studio
    - name: Apply OcarinaStudio
      run: ./studio/scripts/apply.sh .
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-x86_64-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-x86_64-ccache-${{ github.ref }}
          ${{ runner.os }}-x86_64-ccache
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-x86_64-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-x86_64-deps-${{ github.ref }}-
          ${{ runner.os }}-x86_64-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Install latest SDL
      run: |
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - uses: ./.github/actions/install-sdl2-net
    - name: Copy SDL libs to multiarch dir
      run: sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Remove distro tinyxml2
      run: sudo apt-get remove libtinyxml2-dev
    - uses: ./.github/actions/install-tinyxml2
    - name: Install libzip without crypto
      run: |
        sudo apt-get remove -y libzip-dev
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build OcarinaStudio
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release -j4
        (cd build-cmake && cpack -G External)

        mv build-cmake/*.appimage OcarinaStudio.appimage
        cp studio/scripts/launcher/OcarinaAnimator.sh OcarinaAnimator.sh
        chmod +x OcarinaAnimator.sh OcarinaStudio.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: OcarinaStudio-linux-x86_64
        path: |
          OcarinaStudio.appimage
          OcarinaAnimator.sh
    - name: Save Cache deps folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps

  build-windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
    - name: Keep LF line endings (the patch is written with LF)
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Checkout Ship of Harkinian
      uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
        submodules: true
    - name: Checkout OcarinaStudio
      uses: actions/checkout@v7
      with:
        path: studio
    - name: Apply OcarinaStudio
      shell: bash
      run: ./studio/scripts/apply.sh .
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ github.ref }}-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build OcarinaStudio
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_REMOTE_CONTROL=1
        cmake --build build-windows --config Release --parallel 10

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/OcarinaStudio-windows.zip
    - name: Unzip package
      run: Expand-Archive -Path _packages/OcarinaStudio-windows.zip -DestinationPath OcarinaStudio-windows
    - name: Build OcarinaAnimator launcher
      shell: cmd
      run: cl /nologo /O1 /MT studio\scripts\launcher\animator_launcher.c /Fe:OcarinaStudio-windows\OcarinaAnimator.exe /Fo:animator_launcher.obj /link /SUBSYSTEM:WINDOWS user32.lib
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: OcarinaStudio-windows-x64
        path: OcarinaStudio-windows
    - name: Save Cache VCPKG folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg

  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == 'android-arm64' || inputs.platform == 'android-arm32'
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.platform == 'android-arm64' && '["arm64-v8a"]' || inputs.platform == 'android-arm32' && '["armeabi-v7a"]' || '["arm64-v8a","armeabi-v7a"]') }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      ABI: ${{ matrix.abi }}
      API: 24
    steps:
    - uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
        submodules: true
    - uses: actions/checkout@v7
      with:
        path: studio
    - name: Apply OcarinaStudio
      run: ./studio/scripts/apply.sh .
    - name: Android source fixes
      run: |
        # bionic declares __assert itself with another signature
        sed -i 's/void __assert(/void oot_unused_assert(/' soh/include/functions.h
        # the mixer's NEON path uses AArch64-only intrinsics (32-bit ARM falls back to the plain C path)
        sed -i 's/defined(__ARM_NEON)/(defined(__ARM_NEON) \&\& defined(__aarch64__))/' soh/soh/mixer.c
        # Android runs the game from a shared library: SDL calls SDL_main (main is renamed by SDL.h)
        sed -i 's/^add_executable(${PROJECT_NAME} ${ALL_FILES})/add_library(${PROJECT_NAME} SHARED ${ALL_FILES})/' soh/CMakeLists.txt
        sed -i '1i #ifdef __ANDROID__\n#include <SDL.h>\n#endif' soh/src/code/main.c
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        ls "$ANDROID_SDK_ROOT/ndk"
        echo "NDK=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
    - name: Cross-compile dependencies (SDL2, SDL2_net, tinyxml2, libzip)
      run: |
        set -e
        PREFIX="$PWD/deps/android-$ABI"
        mkdir -p deps "$PREFIX"
        TOOLCHAIN="-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-$API -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DCMAKE_FIND_ROOT_PATH=$PREFIX"
        build() { # name url dir extra...
          local name=$1 url=$2 dir=$3; shift 3
          curl -fsSL "$url" | tar xz -C deps
          cmake -S "deps/$dir" -B "deps/build-$name-$ABI" -GNinja $TOOLCHAIN "$@"
          cmake --build "deps/build-$name-$ABI"
          cmake --install "deps/build-$name-$ABI"
        }
        build sdl https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-2.32.8.tar.gz SDL2-2.32.8 -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
        build sdlnet https://www.libsdl.org/projects/SDL_net/release/SDL2_net-2.2.0.tar.gz SDL2_net-2.2.0 -DSDL2NET_SAMPLES=OFF
        build tinyxml2 https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz tinyxml2-10.0.0 -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF
        build libzip https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz libzip-1.10.1 -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF -DENABLE_BZIP2=OFF -DENABLE_LZMA=OFF -DENABLE_ZSTD=OFF -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF -DBUILD_SHARED_LIBS=OFF
    - name: Cross-compile audio libraries (ogg, vorbis, opus, opusfile)
      run: |
        PREFIX="$PWD/deps/android-$ABI"
        TOOLCHAIN="-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-$API -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DCMAKE_FIND_ROOT_PATH=$PREFIX -DCMAKE_POSITION_INDEPENDENT_CODE=ON"
        build() {
          local name=$1 url=$2 dir=$3; shift 3
          curl -fsSL "$url" | tar xz -C deps
          cmake -S "deps/$dir" -B "deps/build-$name-$ABI" -GNinja $TOOLCHAIN "$@"
          cmake --build "deps/build-$name-$ABI"
          cmake --install "deps/build-$name-$ABI"
        }
        build ogg https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz libogg-1.3.5 -DBUILD_SHARED_LIBS=OFF -DINSTALL_DOCS=OFF
        build vorbis https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz libvorbis-1.3.7 -DBUILD_SHARED_LIBS=OFF
        build opus https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz opus-1.5.2 -DBUILD_SHARED_LIBS=OFF -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF
        # opusfile has no CMake in its release tarball: compile the few files it needs
        curl -fsSL https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz | tar xz -C deps
        cat > deps/opusfile-0.12/CMakeLists.txt <<'CML'
        cmake_minimum_required(VERSION 3.10)
        project(opusfile C)
        find_library(OGG_LIB ogg REQUIRED)
        find_library(OPUS_LIB opus REQUIRED)
        add_library(opusfile STATIC src/opusfile.c src/info.c src/internal.c src/stream.c)
        target_include_directories(opusfile PRIVATE include ${CMAKE_INSTALL_PREFIX}/include ${CMAKE_INSTALL_PREFIX}/include/opus)
        target_compile_definitions(opusfile PRIVATE OP_DISABLE_HTTP OP_DISABLE_DOCS)
        install(TARGETS opusfile ARCHIVE DESTINATION lib)
        install(FILES include/opusfile.h DESTINATION include/opus)
        install(FILES include/opusfile.h DESTINATION include)
        CML
        sed -i 's/^        //' deps/opusfile-0.12/CMakeLists.txt
        cmake -S deps/opusfile-0.12 -B deps/build-opusfile-$ABI -GNinja $TOOLCHAIN
        cmake --build deps/build-opusfile-$ABI
        cmake --install deps/build-opusfile-$ABI
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: dl
    - name: Configure
      run: |
        PREFIX="$PWD/deps/android-$ABI"
        cmake -S . -B build-android -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-$API \
          -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release -DUSE_OPENGLES=ON \
          -DCMAKE_EXE_LINKER_FLAGS="-llog -landroid -lEGL -lGLESv3" -DCMAKE_SHARED_LINKER_FLAGS="-llog -landroid -lEGL -lGLESv3" \
          -DCMAKE_C_FLAGS="-D__THROW= -U_FORTIFY_SOURCE" -DCMAKE_CXX_FLAGS="-D__THROW= -U_FORTIFY_SOURCE" \
          -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_FIND_ROOT_PATH="$PREFIX" \
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          2>&1 | tee configure.log
    - name: Build
      run: |
        # Only the game itself: soh.o2r comes from the first job (its packer cannot run on the build machine here).
        cmake --build build-android --target soh -j4 -- -k 0 2>&1 | tee build.log
    - name: Collect native libraries
      run: |
        case "$ABI" in
          arm64-v8a) TRIPLE=aarch64-linux-android ;;
          armeabi-v7a) TRIPLE=arm-linux-androideabi ;;
        esac
        mkdir -p out
        cp build-android/soh/libsoh.so out/
        cp deps/android-$ABI/lib/libSDL2.so out/
        cp $NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TRIPLE/libc++_shared.so out/
        ls -l out
    - name: Upload native libraries
      uses: actions/upload-artifact@v7
      with:
        name: libs-${{ matrix.abi }}
        path: out/*.so
        retention-days: 3
    - name: Show link errors
      if: failure()
      run: cmake --build build-android --target soh -- -v 2>&1 | tail -60
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-${{ matrix.abi }}-logs
        path: |
          configure.log
          build.log
        if-no-files-found: ignore

  package-android:
    if: inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == 'android-arm64' || inputs.platform == 'android-arm32'
    needs: [generate-soh-otr, build-android]
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
    - name: Checkout Ship of Harkinian (extractor assets)
      uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
    - uses: actions/checkout@v7
      with:
        path: studio
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: dl
    - name: Download native libraries
      uses: actions/download-artifact@v8
      with:
        pattern: libs-*
        path: libs
    - name: Assemble the app
      run: |
        APP=studio/android/app/src/main
        # SDL's Java side (must match the libSDL2.so version)
        curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-2.32.8.tar.gz | tar xz
        mkdir -p $APP/java/org/libsdl/app
        cp SDL2-2.32.8/android-project/app/src/main/java/org/libsdl/app/*.java $APP/java/org/libsdl/app/
        # native libraries per ABI
        for dir in libs/libs-*; do
          abi=${dir#libs/libs-}
          mkdir -p $APP/jniLibs/$abi
          cp $dir/*.so $APP/jniLibs/$abi/
        done
        # bundled files: soh.o2r and the extractor's assets folder
        mkdir -p $APP/assets
        cp dl/soh.o2r $APP/assets/soh.o2r
        cp -r soh/assets/yml $APP/assets/extractor
        find $APP/jniLibs -type f | sort
    - name: Build the APK
      working-directory: studio/android
      run: |
        gradle --no-daemon wrapper --gradle-version 8.9
        ./gradlew --no-daemon assembleRelease
    - name: Upload the APK
      uses: actions/upload-artifact@v7
      with:
        name: OcarinaStudio-android
        path: studio/android/app/build/outputs/apk/release/*.apk
        retention-days: 14
