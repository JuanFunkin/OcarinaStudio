name: Build OcarinaStudio

# Manual build: Actions tab -> "Build OcarinaStudio" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: What to build
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
      upstream_ref:
        description: Ship of Harkinian commit to build on (leave empty for the tested one)
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Ship of Harkinian commit this version of OcarinaStudio is developed and tested against.
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'd4bf6528a3bb242bc5d862e4f1ab2b6d385c157b' }}

# Layout of the workspace in every job:
#   .        Ship of Harkinian (the build tree, same as its own workflow)
#   studio/  this repository (patches, overlay, icons, scripts)

jobs:
  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Ship of Harkinian
      uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Ship of Harkinian
      uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
        submodules: true
    - name: Checkout OcarinaStudio
      uses: actions/checkout@v7
      with:
        path: studio
    - name: Apply OcarinaStudio
      run: ./studio/scripts/apply.sh .
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-x86_64-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-x86_64-ccache-${{ github.ref }}
          ${{ runner.os }}-x86_64-ccache
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-x86_64-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-x86_64-deps-${{ github.ref }}-
          ${{ runner.os }}-x86_64-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Install latest SDL
      run: |
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - uses: ./.github/actions/install-sdl2-net
    - name: Copy SDL libs to multiarch dir
      run: sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Remove distro tinyxml2
      run: sudo apt-get remove libtinyxml2-dev
    - uses: ./.github/actions/install-tinyxml2
    - name: Install libzip without crypto
      run: |
        sudo apt-get remove -y libzip-dev
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build OcarinaStudio
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release -j4
        (cd build-cmake && cpack -G External)

        mv build-cmake/*.appimage OcarinaStudio.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: OcarinaStudio-linux-x86_64
        path: OcarinaStudio.appimage
    - name: Save Cache deps folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps

  build-windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Checkout Ship of Harkinian
      uses: actions/checkout@v7
      with:
        repository: HarbourMasters/Shipwright
        ref: ${{ env.UPSTREAM_REF }}
        submodules: true
    - name: Checkout OcarinaStudio
      uses: actions/checkout@v7
      with:
        path: studio
    - name: Apply OcarinaStudio
      shell: bash
      run: ./studio/scripts/apply.sh .
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ github.ref }}-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build OcarinaStudio
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_REMOTE_CONTROL=1
        cmake --build build-windows --config Release --parallel 10

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/OcarinaStudio-windows.zip
    - name: Unzip package
      run: Expand-Archive -Path _packages/OcarinaStudio-windows.zip -DestinationPath OcarinaStudio-windows
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: OcarinaStudio-windows-x64
        path: OcarinaStudio-windows
    - name: Save Cache VCPKG folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg
